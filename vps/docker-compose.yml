version: '3.8'

networks:
  rede-privada:
    driver: bridge

services:
  vps:
    build: .
    container_name: vps_proxy
    ports:
      - "3000:3000"
    environment:
      - SERVER2_URL=https://server2:8080
      - CLIENT_ID=vps_id
      - CLIENT_SECRET=super_secret_key_123
    networks:
      - rede-privada
    volumes:
      - ./certs/server2.crt:/app/certs/server2.crt:ro